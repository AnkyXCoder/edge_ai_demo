CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Edge Impulse SDK Module
CONFIG_EDGE_IMPULSE_SDK=y

# ARM acceleration
CONFIG_FPU=y

# Memory configuration
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# serial console
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE_SUBSYS=n
CONFIG_CONSOLE_GETCHAR=n

# sensor configuration - need to be changed if differente sensor is used
CONFIG_SENSOR=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_I2C=y

CONFIG_ASSERT=y
CONFIG_DEBUG=y
CONFIG_LOG=y

# Optimization
CONFIG_SPEED_OPTIMIZATIONS=y
