CONFIG_GPIO=y
# enable c++ support
CONFIG_CPP=y

# ARM acceleration
CONFIG_FPU=y

# serial console
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE_SUBSYS=n
CONFIG_CONSOLE_GETCHAR=n

# sensor configuration - need to be changed if differente sensor is used
CONFIG_SENSOR=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_I2C=y

CONFIG_ASSERT=y
CONFIG_DEBUG=y
CONFIG_LOG=y
